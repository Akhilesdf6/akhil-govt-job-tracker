name: Government Job Scan
on:
  push:
    paths:
      - "job_finder.py"
      - ".github/workflows/job-scan.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"   # 08:30 IST
    - cron: "0 14 * * *"  # 19:30 IST
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: job-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Scan official recruitment portals and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python job_finder.py
      - name: Commit scan results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/jobs.json seen_ids.json
          git diff --cached --quiet || git commit -m "Update job scan results"
          git push
