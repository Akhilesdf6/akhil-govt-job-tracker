name: Telegram Bot Commands
on:
  push:
    paths:
      - "telegram_commands.py"
      - ".github/workflows/telegram-commands.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: telegram-bot-commands
  cancel-in-progress: false
jobs:
  commands:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Process Telegram bot commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_commands.py
      - name: Save Telegram update offset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telegram_offset.json
          git diff --cached --quiet || git commit -m "Save Telegram bot command offset"
          git push
